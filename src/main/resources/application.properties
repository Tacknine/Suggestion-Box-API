
spring.application.name=Suggestion Box

spring.datasource.url=jdbc:mariadb://localhost:3306/suggestion_box?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================
# MARIADB CONNECTION POOL (HikariCP)
# ============================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# ============================================
# OPTIONAL: MariaDB-specific settings
# ============================================
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true


# ============================================
# SWAGGER / OPENAPI CONFIGURATION
# ============================================

# Enable Swagger UI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# API Documentation Paths
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Swagger UI Settings
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.syntax-highlight.activated=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# API Info
springdoc.info.title=Suggestion Box API
springdoc.info.description=API ya kusimamia maoni ya wateja kwa taasisi ya uwekezaji
springdoc.info.version=1.0.0
springdoc.info.contact.name=Harun
springdoc.info.contact.email=harun@example.com
springdoc.info.contact.url=https://example.com
springdoc.info.license.name=MIT
springdoc.info.license.url=https://opensource.org/licenses/MIT

# Server Configuration
springdoc.servers[0].url=http://localhost:8080
springdoc.servers[0].description=Development Server

# Group Configuration
springdoc.group-configs[0].group=public
springdoc.group-configs[0].paths-to-match=/api/v1/**
springdoc.group-configs[0].packages-to-scan=com.suggestion_box.controller
springdoc.group-configs[0].display-name=Public API

# Security (Optional - JWT)
# springdoc.swagger-ui.oauth.client-id=swagger-ui
# springdoc.swagger-ui.oauth.realm=swagger-ui-realm
# springdoc.swagger-ui.oauth.app-name=Swagger UI